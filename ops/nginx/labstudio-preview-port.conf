# Independent listener. Does not replace the existing port 80/443 site.
server {
    listen 8443 ssl;
    server_name labstudio-inc.ru;
    ssl_certificate /etc/letsencrypt/live/labstudio-inc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labstudio-inc.ru/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
